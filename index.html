<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Instagram</title>
    <link rel="icon" href="https://static.cdninstagram.com/rsrc.php/v3/yI/r/VsNE-OHk_8a.png" type="image/png">
    <style>
        :root {
            --ig-primary-button: #0095f6;
            --ig-stroke: #dbdbdb;
            --ig-text-primary: #262626;
            --ig-text-secondary: #8e8e8e;
            --ig-text-link: #00376b;
            --ig-background-primary: #ffffff;
            --ig-background-secondary: #fafafa;
            --ig-facebook-blue: #385185;
        }

        /* Base & Reset Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--ig-background-secondary);
            color: var(--ig-text-primary);
            font-size: 14px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Page Structure */
        .page-container {
            flex-grow: 1; /* Pushes footer down */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px 0;
        }

        .main-content {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Hidden on mobile, shown on desktop */
        .phone-image-container {
            display: none;
        }

        .form-container {
            max-width: 350px;
            width: 100vw; /* Use viewport width on mobile */
            padding: 0 20px;
        }

        /* Card Styles (Login and Signup) */
        .login-card, .signup-card {
            background-color: var(--ig-background-primary);
            border: 1px solid var(--ig-stroke);
            border-radius: 1px;
            width: 100%;
            text-align: center;
            padding: 10px 40px;
            margin-bottom: 10px;
        }

        /* Instagram Logo */
        .logo {
            width: 175px;
            height: auto;
            margin: 36px auto 12px;
            content: url('https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo.svg/1280px-Instagram_logo.svg.png');
        }

        /* Login Form */
        .login-form {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .login-form input {
            background-color: var(--ig-background-secondary);
            border: 1px solid var(--ig-stroke);
            border-radius: 3px;
            padding: 9px 8px 7px;
            font-size: 12px;
            -webkit-appearance: none;
        }

        .login-form input:focus {
            outline: none;
            border-color: #a8a8a8;
        }

        .login-form button {
            background-color: var(--ig-primary-button);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 9px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            opacity: 0.7;
        }
        
        .login-form button.enabled {
            opacity: 1;
        }

        /* "OR" Separator */
        .separator {
            display: flex;
            align-items: center;
            margin: 18px 0;
            color: var(--ig-text-secondary);
            font-weight: 600;
            font-size: 13px;
        }
        .separator .line { flex-grow: 1; height: 1px; background-color: var(--ig-stroke); }
        .separator span { padding: 0 18px; }

        /* Links */
        .facebook-login {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--ig-facebook-blue);
            font-weight: 600;
            margin-top: 10px;
        }
        .facebook-icon {
            width: 16px; height: 16px; margin-right: 8px;
            content: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23385185"><path d="M22.675 0h-21.35C.589 0 0 .589 0 1.325v21.35C0 23.411.589 24 1.325 24H12.82v-9.29H9.692v-3.622h3.128V8.413c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12V24h6.116c.736 0 1.325-.589 1.325-1.325V1.325C24 .589 23.411 0 22.675 0z"/></svg>');
        }
        .forgot-password { color: var(--ig-text-link); font-size: 12px; text-decoration: none; margin-top: 18px; display: block; }
        .signup-card p { margin: 15px; }
        .signup-card a { color: var(--ig-primary-button); font-weight: 600; text-decoration: none; }

        /* Get The App Section */
        .get-the-app { text-align: center; margin: 20px 0; }
        .app-stores { display: flex; justify-content: center; gap: 8px; margin-top: 20px; }
        .app-stores img { height: 40px; }

        /* Footer Styles */
        .page-footer {
            padding: 20px;
            text-align: center;
            width: 100%;
        }
        .footer-nav ul { list-style: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; margin-bottom: 12px; }
        .footer-nav a { text-decoration: none; color: var(--ig-text-secondary); font-size: 12px; }
        .copyright { color: var(--ig-text-secondary); font-size: 12px; margin-top: 12px; }

        /* --- DESKTOP STYLES --- */
        @media (min-width: 875px) {
            .phone-image-container {
                display: block;
                background-image: url('https://static.cdninstagram.com/images/instagram/xig/homepage/phones/home-phones.png?__d=www');
                background-repeat: no-repeat;
                background-position: -46px 0;
                height: 634px;
                width: 468px;
                margin-right: 32px;
            }
        }

        /* --- MOBILE STYLES for small phones --- */
        @media (max-width: 450px) {
            .login-card, .signup-card {
                border: none;
                background-color: transparent;
            }
            .form-container {
                padding: 0 10px;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <main class="main-content">
            <div class="phone-image-container"></div>
            <div class="form-container">
                <article class="login-card">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo.svg/1280px-Instagram_logo.svg.png" alt="Instagram" class="logo">
                    <form class="login-form" id="loginForm">
                        <input type="text" name="username" aria-label="Phone number, username, or email" placeholder="Phone number, username, or email" autocomplete="username">
                        <input type="password" name="password" aria-label="Password" placeholder="Password" autocomplete="current-password">
                        <button type="submit" disabled>Log in</button>
                    </form>
                    <div class="separator">
                        <div class="line"></div><span>OR</span><div class="line"></div>
                    </div>
                    <a href="#" class="facebook-login">
                        <span class="facebook-icon"></span>
                        <span>Log in with Facebook</span>
                    </a>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </article>
                <article class="signup-card">
                    <p>Don't have an account? <a href="#">Sign up</a></p>
                </article>
                <section class="get-the-app">
                    <p>Get the app.</p>
                    <div class="app-stores">
                        <a href="#"><img src="https://static.cdninstagram.com/rsrc.php/v3/yz/r/c5Rp7Ym-Klz.png" alt="Download on the App Store"></a>
                        <a href="#"><img src="https://static.cdninstagram.com/rsrc.php/v3/yu/r/EHY6QnZYdNX.png" alt="Get it on Google Play"></a>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <footer class="page-footer">
        <nav class="footer-nav">
            <ul>
                <li><a href="#">Meta</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Blog</a></li>
                <li><a href="#">Jobs</a></li>
                <li><a href="#">Help</a></li>
                <li><a href="#">API</a></li>
                <li><a href="#">Privacy</a></li>
                <li><a href="#">Terms</a></li>
                <li><a href="#">Locations</a></li>
                <li><a href="#">Instagram Lite</a></li>
                <li><a href="#">Threads</a></li>
                <li><a href="#">Contact Uploading & Non-Users</a></li>
                <li><a href="#">Meta Verified</a></li>
            </ul>
        </nav>
        <div class="copyright">
            <span>© 2025 Instagram from Meta</span>
        </div>
    </footer>

    <script>
        const loginForm = document.getElementById('loginForm');
        const inputs = loginForm.querySelectorAll('input');
        const button = loginForm.querySelector('button');
        function checkInputs() {
            const allFilled = Array.from(inputs).every(input => input.value.trim() !== '');
            button.disabled = !allFilled;
            button.classList.toggle('enabled', allFilled);
        }
        inputs.forEach(input => input.addEventListener('input', checkInputs));
    </script>
</body>
</html>
